<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joy Flowers</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main>

  <!-- HERO -->
  <section class="hero">

    <div class="flower">✿</div>

    <p>JOY FLOWERS</p>

    <h1>
      This flower is yours.<br>
      <em>You were meant to find it!</em>
    </h1>

    <p class="intro">
      Take a moment to share something that brought you joy today.
    </p>

    <a href="#share">Share your moment ↓</a>

  </section>


  <!-- SHARE -->
  <section id="share" class="card">

    <p>
      Share anonymously. Your words may become a little gift
      for the next person.
    </p>

    <textarea
      id="message"
      maxlength="500"
      placeholder="Today, I'm grateful for…"></textarea>

    <button onclick="leaveJoy()">
      Leave a little joy
    </button>

    <div id="status"></div>

  </section>


  <!-- COUNTERS -->
  <section class="counter">

    <div>
      <strong id="flowers-found">0</strong>
      <span>Flowers found</span>
    </div>

    <div>
      <strong id="joys-shared">0</strong>
      <span>Joys shared</span>
    </div>

  </section>


  <!-- JOY GARDEN -->
  <section class="wall">

  

    <h2>The Joy Garden</h2>

    <div id="messages" class="messages">
      <p>Loading little joys…</p>
    </div>

  </section>

</main>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Joy Flowers -->
<script src="app.js"></script>

</body>
</html>
